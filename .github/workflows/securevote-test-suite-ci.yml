name: Run SecureVote Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Install common packages for blockchain, web apps, and ML
          pip install web3 flask fastapi opencv-python-headless numpy requests

      - name: Execute Test Suite
        run: |
          cd decentralized-voting-system
          PYTHONPATH=/home/runner/work/ByteBug-Project/ByteBug-Project/decentralized-voting-system:$PYTHONPATH python -m pytest tests/ -v
