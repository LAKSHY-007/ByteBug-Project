name: Run SecureVote Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies (for face_recognition)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libsm6 libxrender1 libxext6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Install common packages for blockchain, web apps, and ML
          pip install web3 flask fastapi opencv-python-headless numpy requests
          # Install your specific project dependencies
          pip install python-dotenv
          pip install face-recognition
          # Install any other packages your project needs
          pip install cryptography

      - name: Execute Test Suite
        run: |
          cd decentralized-voting-system
          python -m pytest tests/ -v
